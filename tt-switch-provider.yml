# 内网模型 TT Switch provider 配置（可复现片段）
# 已写入 ~/.dsh/settings.yaml 的 llm-pi-ai.providers.tt-switch（热生效，无需重启）。
# 密钥存于 ~/.dsh/.credentials.yaml refs.TT_SWITCH_API_KEY（write-only，经 credentials.set 写入）。
#
# 费用标注约定（2026-09-11 修订，对齐 iWiki 刊例价与网关实测模型列表）：
#   - 带 -ioa 后缀 = 内网免费，名称标「内网·免费」；混元系（hy3-ioa / hy4-preview-ioa /
#     hy4-dev）HY 系列全免，hy4-dev 虽无 -ioa 后缀同样免费。
#   - 无后缀 = 公费，名称标倍率 =（输入价+输出价）×汇率 ÷ 75（¥/MTok 基准）；
#     美元模型按 1:7 换算；DeepSeek 峰谷取空闲时段价；GPT-5.6 Sol 为 09-01 降价后价格。
#     价格来源：iWiki《Token 看板外部模型刊例价》 https://iwiki.woa.com/p/4020336897
#   - 2026-09 变更：deepseek-v4-flash-ioa 已下线移除；新增 8 个：
#     deepseek-v4.1-flash、glm-5.3-flash-ioa、gpt-6-astra、hy4-dev、hy4-preview-ioa、
#     ttsw-gpt-5.6-{sol,terra,luna}-272k。

llm-pi-ai:
  providers:
    tt-switch:
      displayName: 内网模型 TT Switch
      apiKeyEnv: TT_SWITCH_API_KEY
      api: openai-completions
      baseURL: http://118.31.105.6:18443/tencent/v1
      # 流空闲超时 10 分钟（与 demo 的 STREAM_IDLE_TIMEOUT=600s 一致）；不设总超时，
      # 长推理/长生成不会被掐断，仅以空闲超时兜底。
      streamIdleTimeoutMs: 600000
      # 部署默认推理等级 = high（发挥模型最大性能）；可在 UI 按请求下调
      reasoning: high
      retryPolicy:
        mode: normal
        maxRetries: 3
        backoff:
          initialDelayMs: 500
          maxDelayMs: 10000
          jitterRatio: 0.1
      models:
        # 38 个模型全部来自 GET {baseURL}/models 实测列表（2026-09-11）；
        # reasoningEfforts 等级 off/minimal/low/medium/high 与 demo 的 REASONING_LEVELS 对齐，
        # off 发送空（不携带 reasoning_effort 参数），其余按原值上送。
        # -1m 后缀的 Claude 变体与 ttsw-*-272k 变体声明独立 contextWindow；
        # 其余模型容量走路由默认 defaultContextWindow=262144 / defaultMaxTokens=32768（网关实测接受）。
        # 多模态模型声明 input: [text, image]（共 33 个）；MiniMax M3/M2.7、Hunyuan 3、
        # Hunyuan 4 (dev/preview) 暂按纯文本。声明决定 Harness 入口放行图片；
        # 最终能否识图仍取决于网关/上游对该模型的多模态支持。
        # --- 公费（无 -ioa 后缀；倍率 =（输入+输出）×7÷75，来源 iWiki 刊例价） ---
        - id: claude-sonnet-5
          input: [text, image]
          name: Claude Sonnet 5（1.12x）
          reasoningEfforts: { off: null, minimal: minimal, low: low, medium: medium, high: high }
        - id: claude-sonnet-5-1m
          input: [text, image]
          name: Claude Sonnet 5 (1M)（1.12x）
          contextWindow: 1000000
          reasoningEfforts: { off: null, minimal: minimal, low: low, medium: medium, high: high }
        - id: claude-sonnet-4.6
